# ─── Rota Vital — Spring Boot Config ───
spring.application.name=rota-vital

# Servidor
server.port=8080

# Actuator — health check para deploy
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Info do projeto
management.info.env.enabled=true
info.app.name=Rota Vital
info.app.description=Backend Spring Boot — Banco de Sangue (AED + SO)
info.app.version=1.0.0
info.app.java-version=${java.version}
